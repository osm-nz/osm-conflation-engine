name: Test

on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: ⏬ Checkout code
        uses: actions/checkout@v4

      - name: ⏬ Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - name: ⏬ Install
        run: |
          npm install

      - name: ✨ Lint
        run: |
          npm run lint

      - name: ✨ Typecheck
        run: |
          npm run typecheck

      - name: 🔨 Build
        run: |
          npm run build

      - name: 🧪 Test
        run: |
          npm test

      - name: 📦 Deploy (part 1)
        if: ${{ github.ref == 'refs/heads/main' }}
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📦 Deploy (part 2)
        id: deployment
        uses: actions/deploy-pages@v4
